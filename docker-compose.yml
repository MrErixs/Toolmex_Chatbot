services:
  db:
    image: postgres:15
    container_name: pgvector_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: catalogo
    volumes:
      - ./pgvector-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    command: >
      bash -c "
      apt-get update &&
      apt-get install -y postgresql-server-dev-15 build-essential &&
      docker-entrypoint.sh postgres
      "
  
  scraper:
    build: ./scraper
    container_name: scraper
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: catalogo
      #OPENAI_API_KEY: ${OPENAI_API_KEY}  # si vas a usar embeddings
    depends_on:
      - db
